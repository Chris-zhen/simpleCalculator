
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SimpleCalculator | White Gold Edition</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --gold: #b99756;
      --gold-light: #e5d2a5;
      --gold-dark: #92713b;
      --ivory: #fbfaf7;
      --white: #ffffff;
      --text: #292720;
      --muted: #99958c;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 35px 18px;
      background:
        radial-gradient(circle at 15% 15%, #f1e9d9 0, transparent 35%),
        radial-gradient(circle at 85% 85%, #eee6d6 0, transparent 35%),
        var(--ivory);
      font-family: 'DM Sans', sans-serif;
      color: var(--text);
    }

    .calculator {
      width: 100%;
      max-width: 390px;
      padding: 30px;
      border: 1px solid #e9dfcc;
      border-radius: 28px;
      background: rgba(255,255,255,.94);
      box-shadow: 0 20px 60px rgba(95,75,38,.10);
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
    }

    .brand {
      font-family: 'Playfair Display', serif;
      font-size: 23px;
      font-weight: 700;
      letter-spacing: -.5px;
    }

    .brand span {
      color: var(--gold);
    }

    .edition {
      color: var(--gold-dark);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 2px;
    }

    .display {
      min-height: 145px;
      padding: 20px 5px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: flex-end;
      border-bottom: 1px solid #eee8dc;
      margin-bottom: 22px;
      overflow: hidden;
    }

    .previous {
      min-height: 25px;
      width: 100%;
      color: var(--muted);
      text-align: right;
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    .current {
      width: 100%;
      text-align: right;
      font-size: clamp(35px, 9vw, 48px);
      font-weight: 500;
      letter-spacing: -2px;
      overflow-wrap: anywhere;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    button {
      min-width: 0;
      aspect-ratio: 1;
      border: 1px solid #eee9df;
      border-radius: 17px;
      background: #fff;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 19px;
      font-weight: 600;
      cursor: pointer;
      transition: .18s ease;
      box-shadow: 0 3px 8px rgba(0,0,0,.025);
    }

    button:hover {
      transform: translateY(-2px);
      border-color: var(--gold-light);
      box-shadow: 0 6px 14px rgba(185,151,86,.13);
    }

    button:active {
      transform: scale(.95);
    }

    .utility {
      background: #f5f1e8;
      color: var(--gold-dark);
      border-color: #eee4d0;
    }

    .operator {
      background: #f8f4eb;
      color: var(--gold-dark);
      border-color: #e9dcc0;
      font-size: 22px;
    }

    .equals {
      background: linear-gradient(145deg, #c9ac70, #a98648);
      color: white;
      border: none;
      box-shadow: 0 5px 14px rgba(169,134,72,.25);
    }

    .equals:hover {
      background: linear-gradient(145deg, #b99756, #92713b);
    }

    .zero {
      grid-column: span 2;
      aspect-ratio: auto;
    }

    .footer {
      margin-top: 25px;
      text-align: center;
      color: #b0a99c;
      font-size: 9px;
      letter-spacing: 2.5px;
      font-weight: 600;
    }

    @media (min-width: 700px) {
      .calculator {
        max-width: 410px;
        padding: 34px;
      }

      .buttons {
        gap: 14px;
      }

      button {
        border-radius: 19px;
        font-size: 21px;
      }
    }

    @media (max-width: 380px) {
      .calculator {
        padding: 22px;
        border-radius: 23px;
      }

      .buttons {
        gap: 9px;
      }

      button {
        border-radius: 14px;
        font-size: 17px;
      }
    }
  </style>
</head>

<body>
  <main class="calculator">
    <header class="top">
      <div class="brand">simple<span>Calculator</span></div>
      <div class="edition">GOLD EDITION</div>
    </header>

    <section class="display">
      <div class="previous" id="previous"></div>
      <div class="current" id="current">0</div>
    </section>

    <section class="buttons">
      <button class="utility" onclick="clearAll()">AC</button>
      <button class="utility" onclick="toggleSign()">+/−</button>
      <button class="utility" onclick="percentage()">%</button>
      <button class="operator" onclick="chooseOperator('/')">÷</button>

      <button onclick="appendNumber('7')">7</button>
      <button onclick="appendNumber('8')">8</button>
      <button onclick="appendNumber('9')">9</button>
      <button class="operator" onclick="chooseOperator('*')">×</button>

      <button onclick="appendNumber('4')">4</button>
      <button onclick="appendNumber('5')">5</button>
      <button onclick="appendNumber('6')">6</button>
      <button class="operator" onclick="chooseOperator('-')">−</button>

      <button onclick="appendNumber('1')">1</button>
      <button onclick="appendNumber('2')">2</button>
      <button onclick="appendNumber('3')">3</button>
      <button class="operator" onclick="chooseOperator('+')">+</button>

      <button class="zero" onclick="appendNumber('0')">0</button>
      <button onclick="appendDecimal()">.</button>
      <button class="equals" onclick="calculate()">=</button>
    </section>

    <footer class="footer">MINIMAL • ELEGANT • TIMELESS</footer>
  </main>

  <script>
    let currentValue = '0';
    let previousValue = '';
    let operator = null;
    let shouldReset = false;

    const currentDisplay = document.getElementById('current');
    const previousDisplay = document.getElementById('previous');

    function updateDisplay() {
      currentDisplay.textContent = currentValue;
      previousDisplay.textContent = previousValue && operator
        ? `${previousValue} ${getSymbol(operator)}`
        : '';
    }

    function getSymbol(op) {
      return { '+': '+', '-': '−', '*': '×', '/': '÷' }[op];
    }

    function appendNumber(number) {
      if (currentValue === 'Error') clearAll();

      if (shouldReset) {
        currentValue = number;
        shouldReset = false;
      } else {
        currentValue = currentValue === '0' ? number : currentValue + number;
      }

      updateDisplay();
    }

    function appendDecimal() {
      if (currentValue === 'Error') clearAll();

      if (shouldReset) {
        currentValue = '0.';
        shouldReset = false;
      } else if (!currentValue.includes('.')) {
        currentValue += '.';
      }

      updateDisplay();
    }

    function clearAll() {
      currentValue = '0';
      previousValue = '';
      operator = null;
      shouldReset = false;
      updateDisplay();
    }

    function toggleSign() {
      if (currentValue === '0' || currentValue === 'Error') return;
      currentValue = currentValue.startsWith('-')
        ? currentValue.slice(1)
        : '-' + currentValue;
      updateDisplay();
    }

    function percentage() {
      if (currentValue === 'Error') return;
      currentValue = String(parseFloat(currentValue) / 100);
      updateDisplay();
    }

    function chooseOperator(nextOperator) {
      if (currentValue === 'Error') return;

      if (operator && !shouldReset) calculate();

      previousValue = currentValue;
      operator = nextOperator;
      shouldReset = true;
      updateDisplay();
    }

    function calculate() {
      if (!operator || shouldReset) return;

      const a = parseFloat(previousValue);
      const b = parseFloat(currentValue);
      let result;

      switch (operator) {
        case '+': result = a + b; break;
        case '-': result = a - b; break;
        case '*': result = a * b; break;
        case '/':
          if (b === 0) {
            currentValue = 'Error';
            previousValue = '';
            operator = null;
            shouldReset = true;
            updateDisplay();
            return;
          }
          result = a / b;
          break;
      }

      currentValue = String(Number(result.toPrecision(12)));
      previousValue = '';
      operator = null;
      shouldReset = true;
      updateDisplay();
    }

    document.addEventListener('keydown', (event) => {
      if (/^[0-9]$/.test(event.key)) appendNumber(event.key);
      else if (event.key === '.') appendDecimal();
      else if (['+', '-', '*', '/'].includes(event.key)) chooseOperator(event.key);
      else if (event.key === 'Enter' || event.key === '=') calculate();
      else if (event.key === 'Escape') clearAll();
      else if (event.key === 'Backspace') {
        if (currentValue.length > 1) {
          currentValue = currentValue.slice(0, -1);
        } else {
          currentValue = '0';
        }
        updateDisplay();
      }
      else if (event.key === '%') percentage();
    });

    updateDisplay();
  </script>
</body>
</html>
